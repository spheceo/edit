name: Check

# Every change is checked before it can ship: `just check` (fmt, clippy,
# Rust and TypeScript tests, typecheck, lint, generated-types drift) on the
# platform Edit ships for. Until Nov 1 2026 nothing ran this in CI — `just
# publish` ran it locally and `just nightly` ran nothing — so a broken main
# could reach every install on the Nightly channel.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes, so old runs
# don't hold the Mac runners (GitHub gives five at a time; Nov 11: Mac parts
# waited 7-10 minutes behind superseded runs). A re-run (attempt 2 and on:
# someone's, or a release re-running its commit's cancelled Check,
# release.yml `checked`) has a group of its own: never cancelled, and it
# cancels nothing.
concurrency:
  group: check-${{ github.ref }}-${{ github.run_attempt == 1 && 'first' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    # On each platform releases are built for: a Mac, and Linux since Nov 7
    # (its engine runs FFmpeg where a Mac runs AVFoundation, so each checks
    # its own).
    # In parts side by side (Sphe, Nov 11: Check took ~15 minutes): the Rust
    # (`just check-rust`); on Linux the TypeScript that's the same anywhere
    # (`just check-ts`); the server's tests in two halves (`just check-tests
    # 1/2`, `2/2`) on each; and on the Mac the acceptance run.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        part: [rust, ts, tests-1, tests-2, acceptance]
        exclude:
          - os: macos-latest
            part: ts
          - os: ubuntu-24.04
            part: acceptance
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    name: check (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
          # Two caches: the Rust tests and clippy's, and the debug addon's (every other part builds that).
          key: ${{ matrix.part == 'rust' && 'rust' || 'app' }}
      # The web typecheck needs the WASM preview engine (gitignored, built
      # from Rust): engine-cache.yml's copy when there is one, else built.
      - id: wasm
        if: matrix.part == 'acceptance' || matrix.part == 'ts'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/apps/web/src/engine/pkg
          key: wasm-${{ hashFiles('app/Cargo.toml', 'app/Cargo.lock', 'app/.cargo/**', 'app/crates/**', '!app/crates/**/node_modules/**', 'app/scripts/build-wasm.sh') }}
      - if: (matrix.part == 'acceptance' || matrix.part == 'ts') && steps.wasm.outputs.cache-hit != 'true'
        run: scripts/build-wasm.sh
      # Pinned, as in release.yml: what Edit is built and checked with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # The tools (scripts/ci-tools.sh): just, the FFmpeg Edit ships and, on
      # Linux, Vulkan's software device for the renderer's tests, kept in one
      # cached folder so a Check installs nothing from a package mirror (Nov
      # 11: apt's mirror stopped resolving and failed six Checks in a row).
      - id: image
        run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/ci-tools
          key: ci-tools-${{ matrix.target }}-${{ steps.image.outputs.version }}-${{ hashFiles('app/scripts/ci-tools.sh', 'app/scripts/ffmpeg.sh') }}
          restore-keys: ci-tools-${{ matrix.target }}-
      - name: Tools
        run: |
          scripts/ci-tools.sh ${{ matrix.target }} ci-tools
          echo "$PWD/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        if: matrix.part != 'rust'
        run: bun install --frozen-lockfile
      - name: Check
        if: matrix.part != 'acceptance'
        run: just ${{ matrix.part == 'tests-1' && 'check-tests 1/2' || matrix.part == 'tests-2' && 'check-tests 2/2' || format('check-{0}', matrix.part) }}
      # The Mac's engine tests stop on SIGTRAP in the render tests (Nov 11, three runs running), with nothing in
      # the log to say which and no crash report on the runner: one at a time, the last test named is the one.
      - name: Which engine test stops (one at a time)
        if: failure() && runner.os == 'macOS' && matrix.part == 'rust'
        run: cargo test -p edit-engine --lib -- --test-threads=1 2>&1 | tail -40
      - name: The addon, for acceptance
        if: matrix.part == 'acceptance'
        run: just native debug
      # Acceptance on the Mac (Nov 8 audit, item I; scripts/acceptance.ts): the
      # server from this commit (on the debug addon built a step ago) serving
      # the UI built here, a fixture project made with FFmpeg, the editor
      # opened in headless Chrome (first frame, play, scrub, full screen, no
      # decode error) and Home's layout at two widths. A part of its own since
      # Nov 11, beside the server's tests rather than after them. What a
      # virtual Mac can't do is skipped and said in the run's summary.
      - name: The UI, for acceptance
        if: matrix.part == 'acceptance'
        run: bun run --cwd apps/web build
      - name: Acceptance
        if: matrix.part == 'acceptance'
        timeout-minutes: 8
        env:
          OUT: ${{ runner.temp }}/acceptance
        run: bun scripts/acceptance.ts
      - if: failure() && matrix.part == 'acceptance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: ignore

  # Edit.app's own player, which needs a Mac with a screen (a CI Mac has no
  # window): the same acceptance run with the window helper's self-check
  # (EDIT_PREVIEW_CHECK, crates/edit-window/src/preview.rs), failing on a
  # frame over 100 ms or the page drawing instead. It waits for a Mac of the
  # team's enrolled as a self-hosted runner with the labels below and the
  # repository variable EDIT_MAC_RUNNER set to true (Settings → Secrets and
  # variables → Actions → Variables); until then it is skipped, so Check never
  # queues for a runner that isn't there.
  native:
    needs: check
    if: vars.EDIT_MAC_RUNNER == 'true'
    runs-on: [self-hosted, macOS, edit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
      - name: Build (the addon and the window helper, release; the UI)
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          just wasm web native
          cargo build -p edit-window --release
      - name: Acceptance (native player)
        env:
          OUT: ${{ runner.temp }}/acceptance-native
        run: bun scripts/acceptance.ts --native target/release/edit-window
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-native
          path: ${{ runner.temp }}/acceptance-native
          if-no-files-found: ignore
