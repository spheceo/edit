name: Check

# Every change is checked before it can ship: `just check` (fmt, clippy,
# Rust and TypeScript tests, typecheck, lint, generated-types drift) on the
# platform Edit ships for. Until Nov 1 2026 nothing ran this in CI — `just
# publish` ran it locally and `just nightly` ran nothing — so a broken main
# could reach every install on the Nightly channel.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    # On each platform releases are built for: a Mac, and Linux since Nov 7
    # (its engine runs FFmpeg where a Mac runs AVFoundation, so each checks
    # its own).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
      # The web typecheck needs the WASM preview engine (gitignored, built
      # from Rust): engine-cache.yml's copy when there is one, else built.
      - id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/apps/web/src/engine/pkg
          key: wasm-${{ hashFiles('app/Cargo.toml', 'app/Cargo.lock', 'app/.cargo/**', 'app/crates/**', '!app/crates/**/node_modules/**', 'app/scripts/build-wasm.sh') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: scripts/build-wasm.sh
      # Pinned, as in release.yml: what Edit is built and checked with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Tools (just, FFmpeg)
        if: runner.os == 'macOS'
        run: brew install just ffmpeg
      # Linux: the FFmpeg its release ships (scripts/ffmpeg.sh), and Vulkan's
      # software device for the renderer's tests (Edit renders on Vulkan only;
      # hosted runners have no GPU).
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('app/scripts/ffmpeg.sh') }}
      - name: Tools (just, FFmpeg, Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq just mesa-vulkan-drivers libvulkan1
          scripts/ffmpeg.sh ${{ matrix.target }} ffmpeg
          echo "$PWD/ffmpeg" >> "$GITHUB_PATH"
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: just check
