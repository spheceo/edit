name: Engine cache

# Builds the Rust engine once per change to its sources, on main, and keeps it
# by a hash of them, so a release that changes no Rust skips ~5 minutes of
# compiling. It runs on main because GitHub lets a tag's run read main's
# caches but not another tag's (each nightly used to compile from scratch and
# save a 429 MB cache no later nightly could read). A release whose engine
# isn't here yet (its Rust changed in the same push) compiles it itself.

on:
  push:
    branches: [main]
    paths:
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "app/.cargo/**"
      - "app/crates/**"
      - "app/scripts/build-native.sh"
      - "app/scripts/build-wasm.sh"
      - ".github/workflows/engine-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  native:
    strategy:
      matrix:
        target: [aarch64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The key is taken here, before anything is built into crates/.
      - id: engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/crates/edit-native/edit-native.node
            app/target/${{ matrix.target }}/release/edit-window
          key: engine-${{ matrix.target }}-${{ hashFiles('app/Cargo.toml', 'app/Cargo.lock', 'app/.cargo/**', 'app/crates/**', '!app/crates/**/node_modules/**', 'app/scripts/build-native.sh') }}
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          workspaces: app
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - if: steps.engine.outputs.cache-hit != 'true'
        run: scripts/build-native.sh ${{ matrix.target }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/apps/web/src/engine/pkg
          key: wasm-${{ hashFiles('app/Cargo.toml', 'app/Cargo.lock', 'app/.cargo/**', 'app/crates/**', '!app/crates/**/node_modules/**', 'app/scripts/build-wasm.sh') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: scripts/build-wasm.sh
