name: Release

# `just publish` bumps the patch version, tags it and pushes; this builds the
# Apple Silicon Mac archives and publishes the GitHub Release once they're up
# (a draft until then, so updaters never see a half-built one). No Intel
# build since Oct 29: the whole team is on Apple Silicon.
# `just nightly` tags `nightly-<N>`: the same build, published as a
# pre-release with its number in it (installs on the Nightly channel take it).
#
# Run it by hand (Actions → Release → Run workflow) for a test build: the
# archives land as workflow artifacts and nothing is released.

on:
  push:
    tags: ["v*", "nightly-*"]
  workflow_dispatch:

# Read-only by default: only the jobs that make and publish the release get
# write, and the token reaches only their gh steps (the audit, Oct 23: every
# step, ~480 build scripts and the signing step's tools among them, had it).
permissions:
  contents: read

# The code and its build config live in app/.
defaults:
  run:
    working-directory: app

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}
  RELEASE: ${{ github.event_name == 'push' }}
  NIGHTLY: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'nightly-') }}

jobs:
  # Nothing ships past a red Check (Nov 8 audit, item I): the tag's commit
  # must have passed check.yml, the Mac's leg (its acceptance run included)
  # and Linux's, in the run its push to main started. `just nightly` used to
  # run `just check` only on the machine that tagged, lately Linux, which never
  # touches the Mac's window or AVFoundation. This waits for that run rather
  # than checking again (the Mac runner is scarce), and only the publish waits
  # for this: the build runs beside it. There is
  # no override: fix Check, then tag again. A test build (run by hand) isn't
  # gated.
  checked:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      # write: to run the commit's Check again when a newer push cancelled it (never one that failed).
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check passed for ${{ github.sha }} on the Mac and Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != true ]; then echo "A test build: not gated on Check."; exit 0; fi
          runs() { gh api "repos/$GH_REPO/actions/workflows/check.yml/runs?head_sha=$SHA&event=push&per_page=20" --jq '.workflow_runs | sort_by(.run_number) | last // empty | "\(.id) \(.status) \(.conclusion // "")"'; }
          # `just nightly` pushes main and the tag together: give Check a few minutes to start.
          run=""
          for _ in $(seq 1 30); do
            run="$(runs)"
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::No Check run for $SHA: a tag must be on a commit pushed to main (Check runs on pushes to main). Push it, let Check pass, then tag again."
            exit 1
          fi
          read -r id status conclusion <<<"$run"
          echo "Check run: https://github.com/$GH_REPO/actions/runs/$id"
          # Check takes ~5 minutes; a rerun of a failed leg restarts the wait. A
          # run cancelled because a newer push to main superseded it (check.yml's
          # concurrency) never ran: it's run again for this commit (its own
          # concurrency group, so nothing cancels it) and waited for. A failure
          # is never run again here.
          reruns=0
          for _ in $(seq 1 420); do
            if [ "$status" = completed ] && [ "$conclusion" = cancelled ] && [ "$reruns" -lt 2 ]; then
              echo "Check for $SHA was cancelled (superseded by a newer push): running it again for this release"
              gh run rerun "$id"
              reruns=$((reruns + 1))
              # Until GitHub says it's going again (it can read completed for a few seconds).
              for _ in $(seq 1 24); do
                sleep 5
                read -r id status conclusion <<<"$(runs)"
                [ "$status" != completed ] && break
              done
            fi
            [ "$status" = completed ] && break
            sleep 10
            read -r id status conclusion <<<"$(runs)"
          done
          if [ "$status" != completed ]; then echo "::error::Check for $SHA didn't finish in 70 minutes"; exit 1; fi
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=50" --jq '.jobs[] | "\(.conclusion)|\(.name)"')"
          echo "$jobs"
          # The Mac's legs and the TypeScript's (on a Linux runner) must be there and green; a job skipped by design
          # (the self-hosted Mac's, until one is enrolled) is fine. Linux's own parts aren't in a push's Check.
          for leg in "check (macos" "check (ubuntu-24.04, ts)"; do
            if ! grep -q "^success|$leg" <<<"$jobs"; then
              echo "::error::Check's '$leg…' leg didn't pass for $SHA: https://github.com/$GH_REPO/actions/runs/$id (fix it on main and tag the fixed commit; there is no override)"
              exit 1
            fi
          done
          if grep -qvE "^(success|skipped)[|]" <<<"$jobs" || [ "$conclusion" != success ]; then
            echo "::error::Check failed for $SHA: https://github.com/$GH_REPO/actions/runs/$id (fix it on main and tag the fixed commit; there is no override)"
            exit 1
          fi
          echo "Check passed for $SHA."

  # Everything up to publishing runs beside Check, not after it (Sphe, Nov 11:
  # a nightly took ~35 minutes): the draft and its archives are made while
  # Check runs, and only the publish waits for it. A draft no install sees.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every tag, for a nightly's notes (what changed since the build before).
          fetch-depth: 0
      - name: Tag matches the workspace version
        if: env.RELEASE == 'true' && env.NIGHTLY != 'true'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG but Cargo.toml says $version"
            exit 1
          fi
      - name: Create the draft release
        if: env.RELEASE == 'true' && env.NIGHTLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Edit $TAG" --generate-notes
      - if: env.NIGHTLY == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # The team's two-line note on top (scripts/nightly-notes.ts, what `just
      # nightly` printed before tagging), then each change by its plan item.
      - name: Create the draft nightly
        if: env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          previous="$(git tag --list 'nightly-*' 'v*' --sort=-creatordate --merged "$TAG^" | head -1)"
          # The tag's own message (checkout can leave an annotated tag lightweight): why a nightly went out early.
          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
          forced="$(git tag --list "$TAG" --format='%(contents)' | sed -n 's/^Forced: //p' | head -1)"
          {
            bun scripts/nightly-notes.ts "$previous" "$TAG" "$forced"
            echo
            echo "---"
            echo "Nightly build of Edit $version: a pre-release. Installs on the Nightly channel (the default) offer it at the top of the editor; one click installs it and restarts."
          } > notes.md
          gh release create "$TAG" --draft --prerelease --title "Edit $TAG" --notes-file notes.md

  # The UI (with the WASM preview engine) is the same for every build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The preview engine engine-cache.yml built on main for these Rust
      # sources; compiled here only when it isn't there yet.
      - id: wasm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/apps/web/src/engine/pkg
          key: wasm-${{ hashFiles('app/Cargo.toml', 'app/Cargo.lock', 'app/.cargo/**', 'app/crates/**', '!app/crates/**/node_modules/**', 'app/scripts/build-wasm.sh') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      # Restored, never saved: a tag's cache is only readable by that tag (engine-cache.yml saves on main).
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
          save-if: false
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: scripts/build-wasm.sh
      # Pinned: a binary compiled by Bun 1.4.4 hung at start under the hardened
      # runtime for Writer (Oct 23); 1.4.0 is what Edit is built and checked with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Build the UI
        run: |
          bun install --cwd apps/web --frozen-lockfile
          bun run --cwd apps/web build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: app/apps/web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Linux on 22.04: glibc 2.35, so the addon loads on 22.04 and newer.
          # Its window is Chrome's (apps/server/src/linux_desktop.ts): no helper.
          # Built for nightlies too, for now: a matrix leaving it out for a
          # nightly (fromJSON, then an exclude) never made its build job
          # (nightly-74, Nov 11). Linux installs take releases only (update.ts
          # channelHere), so a nightly's Linux build is offered to no one.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The addon and window helper engine-cache.yml built on main for these
      # Rust sources (~5 of the build's minutes); compiled here only when
      # they aren't there yet.
      - id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/engine
          key: engine-${{ matrix.target }}-${{ hashFiles('app/Cargo.toml', 'app/Cargo.lock', 'app/.cargo/**', 'app/crates/**', '!app/crates/**/node_modules/**', 'app/scripts/build-native.sh') }}
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          workspaces: app
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: app/apps/web/dist
      # Pinned: a binary compiled by Bun 1.4.4 hung at start under the hardened
      # runtime for Writer (Oct 23); 1.4.0 is what Edit is built and checked with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # Linux's slow-motion smoothing (apps/server/src/rife.ts), embedded in
      # `edit`: kept between runs, its release zip is 431 MB.
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/rife
          key: rife-${{ matrix.target }}-${{ hashFiles('app/scripts/rife.sh') }}
      # The addon and the window helper, then everything embedded in one `edit`
      # (apps/server/scripts/embed.ts); `bun build --compile` leaves the
      # signature invalid, so every binary is signed again (ad hoc).
      # EDIT_RELEASE turns on self-update (apps/server/src/update.ts). No
      # token is built in: each person signs in (apps/server/src/accounts.ts).
      - name: Build
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # A nightly carries its number (apps/server/src/version.ts): nightly-12 → 12; 0 for a release.
          nightly=0
          if [ "$NIGHTLY" = true ]; then nightly="${TAG#nightly-}"; fi
          mac=false
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) bun_target=bun-darwin-arm64 mac=true ;;
            x86_64-unknown-linux-gnu) bun_target=bun-linux-x64 ;;
          esac
          bun install --frozen-lockfile
          if [ "${{ steps.engine.outputs.cache-hit }}" = true ]; then
            mkdir -p "target/${{ matrix.target }}/release"
            cp engine/edit-native.node crates/edit-native/
            if [ "$mac" = true ]; then cp engine/edit-window "target/${{ matrix.target }}/release/"; fi
          else
            scripts/build-native.sh ${{ matrix.target }}
          fi
          window=()
          if [ "$mac" = true ]; then window=(--window "target/${{ matrix.target }}/release/edit-window"); else scripts/rife.sh ${{ matrix.target }} rife; window=(--rife rife); fi
          bun apps/server/scripts/embed.ts --native crates/edit-native/edit-native.node "${window[@]}"
          mkdir package
          bun build apps/server/src/embedded.gen.ts --compile --target="$bun_target" \
            --define EDIT_VERSION="\"$version\"" --define EDIT_RELEASE=true --define EDIT_NIGHTLY="$nightly" --outfile package/edit
          if [ "$mac" = true ]; then codesign -s - -f package/edit; fi
      # Each runner runs its own build (no GPU renders: hosted runners have none).
      - name: Smoke test
        run: |
          set -euo pipefail
          package/edit --version
          home="$(mktemp -d)"
          package/edit serve --home "$home" --port 7799 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:7799/api/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:7799/api/health | grep -q '"name":"edit"'
          curl -fsS -X POST http://127.0.0.1:7799/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | grep -q '"serverInfo"'
      # FFmpeg, qjs (yt-dlp's JavaScript runtime) and, on a Mac, edit-speech ship beside `edit`
      # (apps/server/src/tools.ts), pinned in scripts/ffmpeg.sh and
      # scripts/fetch-quickjs.sh; kept between runs so a build doesn't need
      # their hosts up (both scripts skip a matching copy).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/ffmpeg
            app/quickjs
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('app/scripts/ffmpeg.sh', 'app/scripts/fetch-quickjs.sh') }}
      - name: Package
        run: |
          set -euo pipefail
          name="edit-${{ matrix.target }}.tar.gz"
          mkdir dist
          scripts/ffmpeg.sh "${{ matrix.target }}" ffmpeg
          cp ffmpeg/ffmpeg package/edit-ffmpeg
          cp ffmpeg/ffprobe package/edit-ffprobe
          scripts/fetch-quickjs.sh "${{ matrix.target }}" quickjs
          cp "quickjs/qjs-${{ matrix.target }}" package/
          "package/qjs-${{ matrix.target }}" --version
          # The Mac's on-device word source (apps/server/src/mac_speech.ts), built from scripts/edit-speech.swift.
          speech=()
          if [ "${{ runner.os }}" = macOS ]; then scripts/build-speech.sh package/edit-speech; speech=(edit-speech); fi
          tar -czf "dist/$name" -C package edit edit-ffmpeg edit-ffprobe "qjs-${{ matrix.target }}" "${speech[@]}"
          (cd dist && sha256sum "$name" > "$name.sha256" 2>/dev/null || shasum -a 256 "$name" > "$name.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      # Edit.app, the zip installed apps update from, and the disk image (scripts/package-app.sh):
      # signed with the Developer ID and notarised when these secrets are set, ad hoc until then.
      - name: Edit.app and its disk image
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/package-app.sh "${{ matrix.target }}" package dist
      # Handed to the upload job: this job's token can't write the release.
      - name: Keep for the release
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.target }}
          path: app/dist
      - name: Keep as a test build
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NAME }}
          path: app/dist

  # The only steps with a token that writes the release: its files, then its publishing.
  upload:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" --clobber dist/*

  publish:
    needs: [upload, checked]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout here, so no app/ to run in.
    defaults:
      run:
        working-directory: .
    steps:
      # A nightly stays a pre-release: install.sh and Stable installs read `releases/latest`, which skips it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$NIGHTLY" = true ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  # Production's cloud follows the builds (Oct 31: dev and prod split). A
  # nightly or a release deploys, from its own tag, the live relay
  # (edit-relay; `just dev` and agents use edit-relay-dev). Its secrets stay
  # in Infisical prod `/edit-relay` and reach the Worker by hand
  # (`bun scripts/push-secrets.ts --env prod --yes`). Edit stopped using
  # Modal on Nov 3: nothing is deployed there.
  cloud:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Deploy the live relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN repo secret yet: the live relay was NOT deployed with $TAG (deploy it from this tag by hand, or add the secret)"
            exit 0
          fi
          bun install --frozen-lockfile
          cd apps/relay && npx wrangler deploy --env=""
