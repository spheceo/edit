name: Release

# Bump [workspace.package] version in Cargo.toml, commit, then
#   git tag v0.1.0 && git push origin main v0.1.0
# The release stays a draft until every platform is uploaded, so updaters
# (which skip drafts) never see a half-built one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG but Cargo.toml says $version"
            exit 1
          fi
      - name: Create the draft release
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Edit $TAG" --generate-notes

  # The UI (with the WASM preview engine) is the same everywhere: build it once.
  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: oven-sh/setup-bun@v2
      - name: Build the UI
        run: |
          cargo build -p edit-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir web/src/engine/pkg target/wasm32-unknown-unknown/release/edit_wasm.wasm
          bun install --cwd web --frozen-lockfile
          bun run --cwd web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # EDIT_RELEASE turns on self-update (crates/edit/src/update.rs).
      - name: Build
        run: EDIT_RELEASE=1 cargo build --release --locked -p edit --target ${{ matrix.target }}
      - name: Package and upload
        run: |
          set -euo pipefail
          name="edit-${{ matrix.target }}.tar.gz"
          mkdir staging
          cp "target/${{ matrix.target }}/release/edit" staging/edit
          tar -czf "$name" -C staging edit
          shasum -a 256 "$name" > "$name.sha256"
          gh release upload "$TAG" --clobber "$name" "$name.sha256"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
