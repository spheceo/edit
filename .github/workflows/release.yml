name: Release

# `just publish` bumps the patch version, tags it and pushes; this builds
# Apple Silicon and Intel Mac archives and publishes the GitHub Release once
# both are up (a draft until then, so updaters never see a half-built one).
# `just nightly` tags `nightly-<N>`: the same build, published as a
# pre-release with its number in it (installs on the Nightly channel take it).
#
# Run it by hand (Actions → Release → Run workflow) for a test build: the
# archives land as workflow artifacts and nothing is released.

on:
  push:
    tags: ["v*", "nightly-*"]
  workflow_dispatch:

permissions:
  contents: write

# The code and its build config live in app/.
defaults:
  run:
    working-directory: app

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  RELEASE: ${{ github.event_name == 'push' }}
  NIGHTLY: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'nightly-') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, for a nightly's notes (what changed since the build before).
          fetch-depth: 0
      - name: Tag matches the workspace version
        if: env.RELEASE == 'true' && env.NIGHTLY != 'true'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG but Cargo.toml says $version"
            exit 1
          fi
      - name: Create the draft release
        if: env.RELEASE == 'true' && env.NIGHTLY != 'true'
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Edit $TAG" --generate-notes
      - name: Create the draft nightly
        if: env.NIGHTLY == 'true'
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          previous="$(git tag --list 'nightly-*' 'v*' --sort=-creatordate --merged "$TAG^" | head -1)"
          {
            echo "Nightly build of Edit $version: a pre-release. Installs on the Nightly channel (the default) offer it at the top of the editor; one click installs it and restarts."
            echo
            git log --no-merges --format='- %s' ${previous:+$previous..}"$TAG"
          } > notes.md
          gh release create "$TAG" --draft --prerelease --title "Edit $TAG" --notes-file notes.md

  # The UI (with the WASM preview engine) is the same for every build.
  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: oven-sh/setup-bun@v2
      - name: Build the UI
        run: |
          cargo build -p edit-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir apps/web/src/engine/pkg target/wasm32-unknown-unknown/release/edit_wasm.wasm
          bun install --cwd apps/web --frozen-lockfile
          bun run --cwd apps/web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/apps/web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        # Both on the Apple Silicon runner; Intel is cross-compiled.
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: app
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/apps/web/dist
      - uses: oven-sh/setup-bun@v2
      # The addon and the window helper, then everything embedded in one `edit`
      # (apps/server/scripts/embed.ts); `bun build --compile` leaves the
      # signature invalid, so every binary is signed again (ad hoc).
      # EDIT_RELEASE turns on self-update (apps/server/src/update.ts).
      - name: Build
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # A nightly carries its number (apps/server/src/version.ts): nightly-12 → 12; 0 for a release.
          nightly=0
          if [ "$NIGHTLY" = true ]; then nightly="${TAG#nightly-}"; fi
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) bun_target=bun-darwin-arm64 ;;
            x86_64-apple-darwin) bun_target=bun-darwin-x64 ;;
          esac
          bun install --frozen-lockfile
          (cd crates/edit-native && bun install --frozen-lockfile \
            && bunx napi build --release --target ${{ matrix.target }} --dts index.d.ts \
            && codesign -s - -f edit-native.node)
          cargo build --release --locked -p edit-window --target ${{ matrix.target }}
          codesign -s - -f "target/${{ matrix.target }}/release/edit-window"
          bun apps/server/scripts/embed.ts --native crates/edit-native/edit-native.node \
            --window "target/${{ matrix.target }}/release/edit-window"
          mkdir package
          bun build apps/server/src/embedded.gen.ts --compile --target="$bun_target" \
            --define EDIT_VERSION="\"$version\"" --define EDIT_RELEASE=true --define EDIT_NIGHTLY="$nightly" --outfile package/edit
          codesign -s - -f package/edit
      # The runner is Apple Silicon: the arm64 build runs here (no GPU renders: no Metal on hosted runners).
      - name: Smoke test
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          package/edit --version
          home="$(mktemp -d)"
          package/edit serve --home "$home" --port 7799 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:7799/api/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:7799/api/health | grep -q '"name":"edit"'
          curl -fsS -X POST http://127.0.0.1:7799/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | grep -q '"serverInfo"'
      # FFmpeg ships beside `edit` (apps/server/src/tools.ts), pinned in scripts/ffmpeg.sh;
      # kept between runs so a build doesn't need its host up (ffmpeg.sh skips a matching copy).
      - uses: actions/cache@v6
        with:
          path: app/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('app/scripts/ffmpeg.sh') }}
      - name: Package
        run: |
          set -euo pipefail
          name="edit-${{ matrix.target }}.tar.gz"
          mkdir dist
          scripts/ffmpeg.sh "${{ matrix.target }}" ffmpeg
          cp ffmpeg/ffmpeg package/edit-ffmpeg
          cp ffmpeg/ffprobe package/edit-ffprobe
          tar -czf "dist/$name" -C package edit edit-ffmpeg edit-ffprobe
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      # Edit.app, the zip installed apps update from, and the disk image (scripts/package-app.sh):
      # signed with the Developer ID and notarised when these secrets are set, ad hoc until then.
      - name: Edit.app and its disk image
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/package-app.sh "${{ matrix.target }}" package dist
      - name: Upload to the release
        if: env.RELEASE == 'true'
        run: gh release upload "$TAG" --clobber dist/*
      - name: Keep as a test build
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: app/dist

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # No checkout here, so no app/ to run in.
    defaults:
      run:
        working-directory: .
    steps:
      # A nightly stays a pre-release: install.sh and Stable installs read `releases/latest`, which skips it.
      - name: Publish the release
        run: |
          if [ "$NIGHTLY" = true ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
