[workspace]
resolver = "2"
members = ["crates/edit-core", "crates/edit-render", "crates/edit-wasm", "crates/edit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
edit-core = { path = "crates/edit-core" }
edit-render = { path = "crates/edit-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }

# The renderer runs per frame while scrubbing; keep dev builds fast enough to judge feel.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
