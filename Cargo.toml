[workspace]
resolver = "2"
members = [
    "crates/edit-core",
    "crates/edit-render",
    "crates/edit-wasm",
    "crates/edit-engine",
    "crates/edit",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
edit-core = { path = "crates/edit-core" }
edit-render = { path = "crates/edit-render" }
edit-engine = { path = "crates/edit-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }

# Edit must not fail unexpectedly: no panicking shortcuts outside tests (see
# clippy.toml). Handle the failure, or prove it can't happen and say why in an
# #[allow] beside it.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"

# The renderer runs per frame while scrubbing; keep dev builds fast enough to judge feel.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Frame evaluation and the compositor run for every frame of an export and
# every agent render; they're small, so optimising them costs little build
# time. The big `edit` crate stays at 1 so `just dev` rebuilds quickly (its
# heavy per-frame work is in AVFoundation, Accelerate and the GPU).
[profile.dev.package.edit-core]
opt-level = 3

[profile.dev.package.edit-render]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

# The dev server's build (`just serve-build`): release speed where it matters,
# minutes less to link. No LTO and many codegen units with incremental
# compilation, so a one-line change in `edit` rebuilds just that crate's
# changed units. Every crate still builds at opt-level 3 (edit-core and
# edit-render run per frame; `edit` mixes sound and drives the export
# pipeline). Releases (`[profile.release]`, `just publish`) are unchanged.
[profile.serve]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
strip = false
debug = 0
