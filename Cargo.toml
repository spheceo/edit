[package]
name = "unclip"
version = "0.0.1"
edition = "2021"

# The executable name is also the macOS process name when running from Cargo.
# Keep it aligned with Contents/MacOS/Unclip and the bundle plist.
[[bin]]
name = "Unclip"
path = "src/main.rs"

[workspace]
members = ["xtask"]

[dependencies]
cpal = "0.18"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["svg"] }
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "filter", "format", "software-scaling", "software-resampling"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.19"
raw-window-handle = "0.6"


# The editor is graphics- and copy-heavy. Optimizing both our code and dependencies in
# development builds keeps `cargo run` representative of bundled playback performance.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
