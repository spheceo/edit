[package]
name = "kuro"
version = "0.0.1"
edition = "2021"

[workspace]
members = ["xtask"]

[dependencies]
cpal = "0.18"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["svg"] }
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "filter", "format", "software-scaling", "software-resampling"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.19"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSLocale", "NSObject", "NSString", "NSURL"] }
objc2-speech = "0.3"

# The editor is graphics- and copy-heavy. Optimizing both our code and dependencies in
# development builds keeps `cargo run` representative of bundled playback performance.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
