# Separate worker and DO namespaces. No binding to the live Drive Workflow,
# Repack, or the desktop's projects. Secrets are injected explicitly.
name = "edit-relay-modal-pilot"
main = "src/index.ts"
compatibility_date = "2026-09-07"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "TranscriptionBudget"

[[durable_objects.bindings]]
name = "EXPORT_JOBS"
class_name = "ExportJobs"

[[migrations]]
tag = "v1-pilot"
new_sqlite_classes = ["TranscriptionBudget", "ExportJobs"]
