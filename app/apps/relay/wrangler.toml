# Edit's relay: the only place API keys live. Edit installs send audio here;
# keys never ship in the binary. Deploy with `bunx wrangler deploy` from apps/relay/.
name = "edit-relay"
main = "src/index.ts"
compatibility_date = "2026-09-07"
workers_dev = true
preview_urls = false

# Secrets: in Infisical (Repack's project, folder /edit-relay; ElevenLabs and Maps values live there directly),
# pushed with `bun scripts/push-secrets.ts --yes` (dry run without --yes; values on wrangler's
# stdin, never printed). For `wrangler dev`, apps/relay/.dev.vars, gitignored. Never in this file:
#   ELEVENLABS_MAIN_KEY, ELEVENLABS_VOICES_KEY, GOOGLE_MAPS_KEY, PROXY_URL (the YouTube proxy, /v1/proxy)
# Edit's cloud (/v1/cloud/*, src/cloud.ts; signed-in people only, src/auth.ts):
#   R2_ACCOUNT_ID          Cloudflare account id (<id>.r2.cloudflarestorage.com)
#   R2_ACCESS_KEY_ID       an R2 API token's S3 access key id
#   R2_SECRET_ACCESS_KEY   and its secret
#   R2_BUCKET              the bucket (shared with Repack; Edit only uses edit/…)
#   CONVEX_URL             the Convex deployment, https://….convex.cloud
#   CONVEX_SERVICE_TOKEN   added as args.token to every edit: function call
# Cloud jobs (/v1/cloud/jobs/*, src/jobs.ts: Drive → R2 without the Mac) also
# need Google's sign-in, the same three Edit uses for Drive:
#   GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, GOOGLE_DOCS_REFRESH_TOKEN
# which /v1/cloud/google/token also hands Edit as a short-lived access token
# (the sound library, script imports, Drive links and uploads), and the
# footage watcher's model calls (/v1/cloud/ai/chat) need:
#   AI_GATEWAY_API_KEY

[vars]
# Comma-separated voice IDs belonging to ELEVENLABS_VOICES_KEY; all others
# (including the existing house voice) use ELEVENLABS_MAIN_KEY.
ELEVENLABS_VOICES_IDS = "vVj9i7yXuhHiV9JHF0kj,QWUeV5PUhJjaGUhu0cKp"
# Sign-in (accounts.spheceo.com, Oct 23): every route but /health takes a signed-in person's token,
# checked against this issuer's JWKS. The old shared token (CLOUD_TOKEN) was retired the same day.
ACCOUNTS_ISSUER = "https://accounts.spheceo.com"
MODAL_PROXY_URL = "https://sphe-g-personal--edit-proxies-endpoint.us-east.modal.run"
OPEN_MAPS = "0"                    # "1" would let the maps answer with no token
STAMP_CREATOR = "1"                # a project's first commit records who started it (`actor`, from the token); Repack's edit:commitProject takes it since 906b67a (Oct 23)
# Daily audio per client IP and across everyone, in bytes of 32 kbps Opus
# (~14.4 MB per hour). Transcription is needed about once per project.
DAILY_BYTES_PER_IP = "2160000000"  # ~150 hours (Oct 30: raised for five projects at once; 20 until Oct 30, when the cap stopped the team's imports mid-evening)
DAILY_BYTES_TOTAL = "4320000000"  # ~300 hours (~250k credits a day at most; Oct 30: raised for five projects at once; 20 from Oct 22, after Oct 19–21's re-hearing, which names.ts and the kept pieces since stop)
DAILY_REHEAR_BYTES = "720000000"  # ~50 hours of the day for hearing finished footage again with the case's names (Oct 22: re-hears spent the whole day by 00:20 UTC and a new import went unheard)
MAX_UPLOAD_BYTES = "45000000"     # ~3 hours in one request
# The AI Gateway through /v1/cloud/ai/chat (the audit, Oct 23: it had no limits): only these models,
# and a day's spend (USD, the gateway's usage.cost) per person and across everyone.
AI_MODELS = "google/gemini-3.8-flash"
DAILY_AI_USD_PER_IP = "25"  # Oct 30: raised for five projects at once
DAILY_AI_USD_TOTAL = "100"  # Oct 30: raised for five projects at once
AI_RESERVE_USD = "0.1"            # held for each call while it runs, so calls at once can't pass the budget together; settled at its real cost

# Map stills (Google Photorealistic 3D Tiles, billed per session): a day's
# sessions per IP and across everyone (raised Oct 21 to finish a round of map
# re-renders). 80 a day is at most ~2,400 a month;
# compare with Google's current free allowance before raising it.
DAILY_MAP_SESSIONS_PER_IP = "200"  # Oct 30: raised for five projects at once
DAILY_MAP_SESSIONS_TOTAL = "600"  # Oct 30: raised for five projects at once
# Geocode and building-outline lookups (billed per call, ~$5 per 1,000): a day's per person and across everyone.
DAILY_LOOKUPS_PER_IP = "1000"  # Oct 30: raised for five projects at once
DAILY_LOOKUPS_TOTAL = "3000"  # Oct 30: raised for five projects at once

# Voice generation (text to speech, billed per character): one request's
# limit, and a day's characters per IP and across everyone. A 10-minute
# narration is ~9,000 characters; retakes count again.
MAX_SPEECH_CHARS = "5000"
DAILY_SPEECH_CHARS_PER_IP = "300000"  # ~30 ten-minute narrations with retakes (Oct 30: raised for five projects at once)
DAILY_SPEECH_CHARS_TOTAL = "1000000"  # Oct 30: raised for five projects at once

# Bursts: a few requests a minute per IP.
[[ratelimits]]
name = "BURST"
namespace_id = "7701"

[ratelimits.simple]
limit = 4
period = 60

# Script mode's cloud calls a minute per person (/v1/cloud/writer/*: the sync's
# pulls and pushes, review polling, fixing check-ins, the footage handoff), as
# Writer's relay allowed them: 4 a minute (BURST) stalled the sync. 7710: not a
# namespace Writer's relay uses either.
[[ratelimits]]
name = "CLOUD_BURST"
namespace_id = "7710"

[ratelimits.simple]
limit = 1200
period = 60

# A long file is heard in ~40-second pieces, four at a time (the server's
# transcribe.ts): 60 a minute keeps them moving; the daily byte quotas below
# still bound the spend.
[[ratelimits]]
name = "TRANSCRIBE_BURST"
namespace_id = "7703"

[ratelimits.simple]
limit = 60
period = 60

# Voice lines come in runs (generate every line): more per minute.
[[ratelimits]]
name = "SPEECH_BURST"
namespace_id = "7702"

[ratelimits.simple]
limit = 30
period = 60

# Atomic daily reservations, including requests still in flight.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "TranscriptionBudget"

[[migrations]]
tag = "v1-budget"
new_sqlite_classes = ["TranscriptionBudget"]

# Cloud jobs: a Drive file copied to R2 part by part, each part a durable step
# (src/jobs.ts). Billed as Workflow steps on Workers Paid.
[[workflows]]
name = "edit-drive-to-r2"
binding = "DRIVE_TO_R2"
class_name = "DriveToR2"

# Independent of the existing Drive Workflow and transcription budget.
# Disabled until MODAL_EXPORT_URL, MODAL_RENDER_VERSION, MODAL_WORKER_TOKEN
# and an explicit MODAL_DAILY_BUDGET_USD are configured. MODAL_GPU=L4 by default.
[[durable_objects.bindings]]
name = "EXPORT_JOBS"
class_name = "ExportJobs"

[[migrations]]
tag = "v2-export-jobs"
new_sqlite_classes = ["ExportJobs"]
