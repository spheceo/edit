<script>
// Edit's side of an effect page, put into the page by the server ahead of the
// effect's own code (effects.ts). An effect is a page that draws any moment
// on request:
//
//   window.duration   its length in seconds
//   window.ready      a Promise: pictures decoded, fonts loaded
//   window.seek(t)    draw the frame for second t; the same t, the same pixels
//
// The page has no origin of its own and no network, and never sees the app:
// the playhead comes in by message from the viewer (live), or by a call from
// the Chrome Edit drives (stills, the render). This keeps "the same t, the
// same pixels" true where it can, and says so, once each, where the page's
// code breaks it.
(() => {
  const host = window.parent !== window ? window.parent : null;
  const problems = [];
  const errors = [];
  const tell = (message) => host && host.postMessage({ edit: message }, "*");
  const problem = (text) => {
    if (problems.includes(text)) return;
    problems.push(text);
    tell({ problem: text });
  };
  const failed = (text) => {
    if (errors.length < 8 && !errors.includes(text)) errors.push(text);
    tell({ error: text });
  };
  const state = { ready: false, sought: false };

  // The page's own clock never draws: only seek(t) does, or the picture
  // played isn't the picture rendered.
  const frame = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = () => {
    problem("requestAnimationFrame was called. An effect draws only inside seek(t): work every value out from t there, with no loop of its own.");
    return 0;
  };
  const every = window.setInterval.bind(window);
  window.setInterval = (...given) => {
    problem("setInterval was called. Nothing may change the picture between seeks: work every value out from t inside seek(t).");
    return every(...given);
  };

  // Math.random is the same for the same t: one stream while the page loads,
  // and one a seek, started from its t.
  let seed = 0x9e3779b9;
  Math.random = () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let x = seed;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };

  /** Draws second `t`: the milliseconds its code took, or what it threw. */
  const seek = (t) => {
    if (typeof window.seek !== "function") return { error: "The page has no window.seek(t)." };
    seed = (Math.imul(Math.round(t * 1000) | 0, 0x85ebca6b) ^ 0x9e3779b9) >>> 0;
    const from = performance.now();
    try {
      window.seek(t);
    } catch (error) {
      const text = String((error && error.stack) || error);
      failed(`seek(${t}) threw: ${text}`);
      return { error: text };
    }
    const spent = performance.now() - from;
    if (!state.sought) {
      state.sought = true;
      try {
        if (document.getAnimations().some((animation) => animation.playState === "running")) {
          problem("A CSS animation or transition is running. They play on the page's own clock: set each property inside seek(t) instead.");
        }
      } catch {}
    }
    return { spent };
  };

  /**
   * What a frame costs here while it plays from second `t`: five frames in a
   * row, `step` seconds apart, each drawn on the screen's next refresh, and
   * the middle one of the gaps between them in milliseconds. A page the
   * screen keeps up with answers the screen's own interval (16.7 at 60 Hz).
   */
  const cost = (t, step) =>
    new Promise((resolve) => {
      const gaps = [];
      let last = 0;
      let drawn = 0;
      const tick = (now) => {
        if (last) gaps.push(now - last);
        last = now;
        if (drawn === 5) return resolve(gaps.slice(1).sort((a, b) => a - b)[Math.floor((gaps.length - 1) / 2)]);
        seek(t + drawn * step);
        drawn += 1;
        frame(tick);
      };
      frame(tick);
    });

  window.addEventListener("message", (event) => {
    if (event.source !== host) return;
    const message = event.data && event.data.edit;
    if (!message) return;
    if (typeof message.seek === "number" && state.ready) seek(message.seek);
  });
  window.addEventListener("error", (event) => failed(event.message + (event.filename ? ` (${event.filename.split("/").pop()}:${event.lineno})` : "")));
  window.addEventListener("unhandledrejection", (event) => failed(String((event.reason && event.reason.message) || event.reason)));

  const ready = new Promise((resolve) => {
    const start = () => {
      if (!("ready" in window)) problem("The page has no window.ready: a Promise that resolves once its pictures and fonts are loaded.");
      Promise.resolve(window.ready).then(
        () => {},
        (error) => failed(`window.ready was rejected: ${String((error && error.message) || error)}`),
      ).then(() => {
        state.ready = true;
        if (!(Number.isFinite(window.duration) && window.duration > 0)) problem("The page has no window.duration: its length in seconds, a number above 0.");
        const duration = Number.isFinite(window.duration) && window.duration > 0 ? window.duration : 0;
        tell({ ready: true, duration });
        resolve({ duration, seek: typeof window.seek === "function" });
      });
    };
    if (document.readyState === "complete") start();
    else window.addEventListener("load", start, { once: true });
  });

  // What the Chrome Edit drives calls.
  window.__edit = { ready, seek, cost, problems, errors };
})();
</script>
