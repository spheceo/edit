<!doctype html>
<html lang="en" class="dark" style="background: #0b0b0b">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Edit</title>
  </head>
  <body>
    <!-- Edit's loader (Logo.tsx Loader) while the app's code comes: React replaces it. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot .clip { transform-box: fill-box; transform-origin: left center; animation: boot-clip 1.6s cubic-bezier(.45, 0, .2, 1) infinite; }
      .boot .clip-2 { animation-delay: .18s; }
      .boot .clip-3 { animation-delay: .36s; }
      .boot .head { animation: boot-head 1.6s cubic-bezier(.45, 0, .2, 1) infinite; }
      @keyframes boot-clip { 0%, 100% { transform: scaleX(1); opacity: 1; } 45% { transform: scaleX(.42); opacity: .55; } }
      @keyframes boot-head { 0%, 100% { transform: translateX(-30px); } 50% { transform: translateX(6px); } }
      @media (prefers-reduced-motion: reduce) { .boot .clip, .boot .head { animation: none; } }
    </style>
    <div id="root"><div class="boot" role="status" aria-label="Opening Edit"><svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true" style="overflow: visible"><rect class="clip" x="8" y="16" width="46" height="9.5" rx="3" fill="#5b8cff" /><rect class="clip clip-2" x="8" y="29" width="30" height="9.5" rx="3" fill="#ff4f9a" /><rect class="clip clip-3" x="8" y="42" width="46" height="9.5" rx="3" fill="#ffc23d" /><g class="head"><path d="M41.5 8h7a.5.5 0 0 1 .5.5v3.4a1 1 0 0 1-.3.7L46 15.4V55a1 1 0 0 1-2 0V15.4l-2.7-2.8a1 1 0 0 1-.3-.7V8.5a.5.5 0 0 1 .5-.5z" fill="#fff" /></g></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
