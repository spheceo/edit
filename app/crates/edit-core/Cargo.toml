[package]
name = "edit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Edit's project model and timeline evaluation, shared by the browser and the server"

[features]
# TypeScript types for the model (`just types` writes them into
# packages/edit-types/src/generated). Off for the WASM build and the server.
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
