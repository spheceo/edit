[package]
name = "edit-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Edit's desktop window: a Tauri webview onto the server `edit` runs"

[[bin]]
name = "edit-window"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
# The window's long poll's answer (focus, and notices to post).
serde = { workspace = true }
serde_json = { workspace = true }

# Catches an Objective-C exception in event handling (src/events.rs); already
# in the build through tao, with this feature on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
# The native preview (src/preview.rs): the engine draws the edit into a layer under the page.
edit-engine = { path = "../edit-engine" }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSValue", "NSGeometry", "NSBundle", "NSError", "objc2-core-foundation"] }
# Notifications in Notification Center (src/notices.rs).
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSGraphics", "objc2-core-foundation", "objc2-quartz-core"] }

# Signals the server and what it started (its process group) when the window quits.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
