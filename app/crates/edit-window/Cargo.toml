[package]
name = "edit-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Edit's desktop window: a Tauri webview onto the server `edit` runs"

[[bin]]
name = "edit-window"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }

# Catches an Objective-C exception in event handling (src/events.rs); already
# in the build through tao, with this feature on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
