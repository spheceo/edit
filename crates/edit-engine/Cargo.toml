[package]
name = "edit-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Edit's native engine: frame renders, exports, previews, sound measurement, tracking and face detection"

[features]
# TypeScript types for the export options, plans and probes the native
# addon hands out (`just types`).
ts = ["dep:ts-rs", "edit-core/ts"]

[dependencies]
edit-core.workspace = true
edit-render = { workspace = true, features = ["bundled-fonts"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
base64 = "0.22"
png = "0.18"
pollster = "1"
parking_lot = "0.12"
ebur128 = "0.1"
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
