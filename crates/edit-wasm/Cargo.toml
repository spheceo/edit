[package]
name = "edit-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser bindings for Edit's renderer (built with wasm-bindgen into web/src/engine)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
edit-core.workspace = true
edit-render.workspace = true
serde_json.workspace = true
wgpu.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "HtmlVideoElement", "VideoFrame", "console"] }
console_error_panic_hook = "0.1"
