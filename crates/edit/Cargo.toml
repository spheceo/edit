[package]
name = "edit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Edit: a local, agent-driven video editor (a desktop app, or served to your browser)"

[[bin]]
name = "edit"
path = "src/main.rs"

[dependencies]
edit-core.workspace = true
edit-render = { workspace = true, features = ["bundled-fonts"] }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "catch-panic"] }
rust-embed = "8"
mime_guess = "2"
base64 = "0.22"
png = "0.18"
pollster = "1"
futures-util = "0.3"
sha2 = "0.11"
tauri = { version = "2", features = [] }
parking_lot = "0.12"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
