<!doctype html><html><head><meta charset="utf-8">
<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}#map{position:absolute;left:0;top:0}</style></head><body><div id="map"></div>
<script>
const C = __CONFIG__;
const send = (type, body) => fetch(location.href, { method: "POST", headers: { "content-type": type, "x-map-info": JSON.stringify(info) }, body });
// A refused tile request carries the relay's reason (e.g. today's maps used up).
const fail = (error) => send("text/plain", (error && error.statusCode && String(error.response || error.statusCode)) || String((error && error.stack) || error));
window.onerror = (message) => fail(message);
const info = { start: Date.now() };
// Exactly the picture's size (the window is a little larger).
document.getElementById("map").style.cssText += `;width:${C.width}px;height:${C.height}px`;
const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
async function until(test, ms) { const end = Date.now() + ms; while (!test() && Date.now() < end) await sleep(200); }
// The place in glowing red, drawn over the picture: the building's outline
// raised to its roof (heights read off the 3D tiles), or a ring on the ground.
// Where it lands in the picture goes back as info.building (left, top, right, bottom px).
async function mark(ctx, ground) {
  const scene = window.viewer.scene;
  const toScreen = (lon, lat, height) => scene.cartesianToCanvasCoordinates(Cesium.Cartesian3.fromDegrees(lon, lat, height));
  const scale = C.width / scene.canvas.width;
  const frame = (points) => {
    const xs = points.map((p) => p.x * scale), ys = points.map((p) => p.y * scale);
    info.building = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)].map(Math.round);
  };
  const path = (points) => { ctx.beginPath(); points.forEach((p, i) => (i ? ctx.lineTo(p.x * scale, p.y * scale) : ctx.moveTo(p.x * scale, p.y * scale))); ctx.closePath(); };
  ctx.save();
  ctx.shadowColor = "rgba(255, 30, 30, 0.95)";
  ctx.shadowBlur = 36 * C.height / 1080;
  ctx.lineJoin = "round";
  ctx.lineWidth = 4 * C.height / 1080;
  ctx.strokeStyle = "rgba(255, 60, 60, 0.95)";
  ctx.fillStyle = "rgba(255, 25, 25, 0.38)";
  if (C.ring) {
    const middle = C.ring.reduce((sum, p) => [sum[0] + p[0] / C.ring.length, sum[1] + p[1] / C.ring.length], [0, 0]);
    let roof = ground + 8;
    try {
      const inside = C.ring.map((p) => Cesium.Cartographic.fromDegrees(middle[0] + (p[0] - middle[0]) * 0.6, middle[1] + (p[1] - middle[1]) * 0.6)).concat([Cesium.Cartographic.fromDegrees(middle[0], middle[1])]);
      const heights = (await scene.sampleHeightMostDetailed(inside)).map((c) => c.height).filter(Number.isFinite).sort((a, b) => a - b);
      if (heights.length) roof = Math.max(ground + 3, heights[Math.floor(heights.length / 2)]);
    } catch (error) { console.log(error); }
    const base = C.ring.map((p) => toScreen(p[0], p[1], ground));
    const top = C.ring.map((p) => toScreen(p[0], p[1], roof));
    if (base.concat(top).some((p) => !p)) return ctx.restore();
    frame(base.concat(top));
    for (let i = 0; i + 1 < base.length; i++) { path([base[i], base[i + 1], top[i + 1], top[i]]); ctx.fill(); }
    path(top); ctx.fill(); ctx.stroke();
    for (let i = 0; i < base.length; i++) { ctx.beginPath(); ctx.moveTo(base[i].x * scale, base[i].y * scale); ctx.lineTo(top[i].x * scale, top[i].y * scale); ctx.stroke(); }
  } else {
    const ring = [];
    for (let i = 0; i <= 64; i++) {
      const angle = (i / 64) * Math.PI * 2, meters = 28;
      ring.push(toScreen(C.lon + (meters * Math.cos(angle)) / (111320 * Math.cos((C.lat * Math.PI) / 180)), C.lat + (meters * Math.sin(angle)) / 110540, ground + 1));
    }
    if (ring.some((p) => !p)) return ctx.restore();
    frame(ring);
    path(ring); ctx.fill(); ctx.lineWidth *= 1.5; ctx.stroke();
  }
  ctx.restore();
}

(async () => {
  Cesium.GoogleMaps.mapTilesApiEndpoint = new Cesium.Resource({ url: C.relay + "/" });
  Cesium.GoogleMaps.defaultApiKey = "relay";
  const viewer = (window.viewer = new Cesium.Viewer("map", {
    globe: false, baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false, infoBox: false,
    selectionIndicator: false, contextOptions: { webgl: { preserveDrawingBuffer: true } },
  }));
  viewer.resolutionScale = 1;
  const scene = viewer.scene;
  // No camera collision: while only coarse tiles are in, it takes the camera
  // for underground and lifts it away from the place.
  scene.screenSpaceCameraController.enableInputs = false;
  scene.screenSpaceCameraController.enableCollisionDetection = false;
  const tileset = await Cesium.createGooglePhotorealistic3DTileset({ onlyUsingWithGoogleGeocoder: true }, { showCreditsOnScreen: true, maximumScreenSpaceError: 6, enableCollision: false });
  scene.primitives.add(tileset);
  const place = Cesium.Cartographic.fromDegrees(C.lon, C.lat);
  viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(C.lon, C.lat, 900) });
  await until(() => tileset.tilesLoaded, 30000);
  // The ground: the lowest of a few points around the place (the place itself
  // may be a roof or a tree).
  let ground = 0;
  try {
    const around = [place];
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2, meters = 45;
      around.push(Cesium.Cartographic.fromDegrees(C.lon + (meters * Math.cos(angle)) / (111320 * Math.cos((C.lat * Math.PI) / 180)), C.lat + (meters * Math.sin(angle)) / 110540));
    }
    const heights = (await scene.sampleHeightMostDetailed(around)).map((c) => c && c.height).filter(Number.isFinite);
    if (heights.length) ground = Math.min(...heights);
  } catch (error) { info.sampleError = String(error); }
  info.ground = ground;
  const center = Cesium.Cartesian3.fromDegrees(C.lon, C.lat, ground + 8);
  const aim = () => {
    viewer.camera.lookAt(center, new Cesium.HeadingPitchRange(Cesium.Math.toRadians(C.heading), Cesium.Math.toRadians(-C.pitch), C.range));
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  };
  aim();
  await sleep(500);
  await until(() => tileset.tilesLoaded, 60000);
  // Aim again in case anything moved the camera, and let any new tiles in.
  aim();
  await sleep(300);
  await until(() => tileset.tilesLoaded, 20000);
  info.loaded = tileset.tilesLoaded;
  info.range = Math.round(Cesium.Cartesian3.distance(viewer.camera.positionWC, center));

  info.seconds = (Date.now() - info.start) / 1000;
  await sleep(1500);
  viewer.render();
  const out = document.createElement("canvas");
  out.width = C.width; out.height = C.height;
  const ctx = out.getContext("2d");
  ctx.drawImage(scene.canvas, 0, 0, C.width, C.height);
  if (C.highlight) await mark(ctx, ground);
  // Google's logo and the imagery's data providers, as Google requires.
  const logo = new Image(); logo.crossOrigin = "anonymous"; logo.src = "https://assets.ion.cesium.com/google-credit.png?edit";
  await logo.decode().catch(() => {});
  // Far enough in to survive a push-in to 1.07.
  const unit = C.height / 1080, inX = C.width * 0.036, inY = C.height * 0.036;
  const credits = viewer.cesiumWidget.creditContainer.innerText.split(/[•\n]/).map((part) => part.trim()).filter(Boolean).join(" · ");
  if (logo.naturalWidth) ctx.drawImage(logo, inX, C.height - inY - logo.naturalHeight * unit, logo.naturalWidth * unit, logo.naturalHeight * unit);
  ctx.font = `${Math.round(15 * unit)}px Helvetica, Arial, sans-serif`; ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.textAlign = "right";
  ctx.fillText(credits, C.width - inX, C.height - inY);
  out.toBlob((blob) => send("image/png", blob), "image/png");
})().catch(fail);
</script></body></html>
