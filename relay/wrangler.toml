# Edit's relay: the only place API keys live. Edit installs send audio here;
# keys never ship in the binary. Deploy with `bunx wrangler deploy` from relay/.
name = "edit-relay"
main = "src/index.ts"
compatibility_date = "2026-09-07"
workers_dev = true
preview_urls = false

# Secrets (`bunx wrangler secret put NAME`; for `wrangler dev`, relay/.dev.vars,
# gitignored). Never in this file:
#   ELEVENLABS_API_KEY, ELEVENLABS_SPEECH_KEY, GOOGLE_MAPS_KEY, CLIENT_TOKEN
# Edit's cloud (/v1/cloud/*, src/cloud.ts); without CLOUD_TOKEN every cloud
# request is refused:
#   CLOUD_TOKEN            the bearer token Edit sends (its EDIT_RELAY_TOKEN; if
#                          CLIENT_TOKEN is set too, it must be the same value)
#   R2_ACCOUNT_ID          Cloudflare account id (<id>.r2.cloudflarestorage.com)
#   R2_ACCESS_KEY_ID       an R2 API token's S3 access key id
#   R2_SECRET_ACCESS_KEY   and its secret
#   R2_BUCKET              the bucket (shared with Repack; Edit only uses edit/…)
#   CONVEX_URL             the Convex deployment, https://….convex.cloud
#   CONVEX_SERVICE_TOKEN   added as args.token to every edit: function call

[vars]
# Daily audio per client IP and across everyone, in bytes of 32 kbps Opus
# (~14.4 MB per hour). Transcription is needed about once per project.
DAILY_BYTES_PER_IP = "72000000"   # ~5 hours
DAILY_BYTES_TOTAL = "216000000"   # ~15 hours
MAX_UPLOAD_BYTES = "45000000"     # ~3 hours in one request

# Map stills (Google Photorealistic 3D Tiles, billed per session): a day's
# sessions per IP and across everyone. 30 a day is at most ~900 a month;
# compare with Google's current free allowance before raising it.
DAILY_MAP_SESSIONS_PER_IP = "15"
DAILY_MAP_SESSIONS_TOTAL = "30"

# Voice generation (text to speech, billed per character): one request's
# limit, and a day's characters per IP and across everyone. A 10-minute
# narration is ~9,000 characters; retakes count again.
MAX_SPEECH_CHARS = "5000"
DAILY_SPEECH_CHARS_PER_IP = "60000"
DAILY_SPEECH_CHARS_TOTAL = "150000"

# Bursts: a few requests a minute per IP.
[[ratelimits]]
name = "BURST"
namespace_id = "7701"

[ratelimits.simple]
limit = 4
period = 60

# Voice lines come in runs (generate every line): more per minute.
[[ratelimits]]
name = "SPEECH_BURST"
namespace_id = "7702"

[ratelimits.simple]
limit = 30
period = 60

# Atomic daily reservations, including requests still in flight.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "TranscriptionBudget"

[[migrations]]
tag = "v1-budget"
new_sqlite_classes = ["TranscriptionBudget"]
